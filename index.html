<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather-app</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

<link  rel= " stylesheet " href="styles.css">
<body>
    <div class="main">
      <div class="card-wrapper">
    <div class="card-container">
      
    <div class= "card ">

   <h2> Weather Forecast</h2>

<div class="weather">
    <div class= "wea-icon">
   <i class="fa-solid fa-cloud"></i>
    <i class="fa-solid fa-bolt"></i>
    </div>
    <p class="temp" id="default-temp">  </p>
    <p class = "city" id="default-city"> </p>
    
    <button class="btn" id= "detail-btn"> see details</button>
 
</div>
</div>
    <div class="card-container">
      
 <!-- SECOND CARD FOR USER INPUT + FORECAST -->
<!-- Second Card (Hidden by default) -->
<div id="details-card" class="sec-card" style="display: none;">
  <div id="search-area">
    <input type="text" id="city-input" placeholder="Enter city name" />
    <button id="search-btn">Search</button>
  </div>

  <div id="weather-info" style="margin-top: 20px;">
    <h2 id="city-name"></h2>
    <p id="weather-desc"></p>
    <p id="temp"></p>
    <p id="humidity"></p>
    <p id="wind"></p>

    
    <div id="forecast-container"></div>
  </div>
</div>

</div>
</div>
    </div>
